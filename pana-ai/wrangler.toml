name = "pana-ai"
main = "pana-worker.js"
compatibility_date = "2026-08-01"

# Giới hạn chống lạm dụng: 30 lượt mỗi IP trong 10 phút (sửa RATE_LIMIT trong pana-worker.js).
# Namespace đã tạo sẵn ngày 09/08/2026 bằng: npx wrangler kv namespace create PANA_RL
[[kv_namespaces]]
binding = "PANA_RL"
id = "fc4c96fa04864a8b8559f0d8e355f1a2"

# Google chặn Gemini theo vị trí địa lý và KHÔNG cho gọi từ Hong Kong — mà Cloudflare lại hay
# chạy Worker ở PoP HKG khi người dùng ở Việt Nam. Durable Object dưới đây được ghim vào vùng
# "enam" (Đông Bắc Mỹ) và là nơi duy nhất gọi sang Google, nên request luôn đi từ vùng hợp lệ.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "GeminiRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiRelay"]

# KHÔNG BAO GIỜ đặt GEMINI_API_KEY ở file này — file này sẽ bị commit lên GitHub.
# Cài key bằng lệnh (key chỉ nằm trên server Cloudflare):
#   npx wrangler secret put GEMINI_API_KEY
